<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>碰碰胡 - 今日运势</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #FF6B35;
      --primary-light: #FF8F66;
      --secondary: #4ECDC4;
      --bg-dark: #0D1117;
      --bg-card: #161B22;
      --text-primary: #FFFFFF;
      --text-secondary: #8B949E;
      --border: #30363D;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== 头部 ========== */
    .header {
      background: linear-gradient(180deg, #1a1f2e 0%, var(--bg-dark) 100%);
      padding: 20px 16px 40px;
      text-align: center;
      position: relative;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ========== 主容器 ========== */
    .container {
      padding: 0 16px 100px;
      margin: 0 auto;
      max-width: 520px;
    }

    /* ========== 运势卡片 ========== */
    .fortune-card {
      background: linear-gradient(135deg, rgba(255,107,53,0.15) 0%, rgba(78,205,196,0.1) 100%);
      border-radius: 24px;
      padding: 32px 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,107,53,0.3);
      text-align: center;
    }

    .fortune-icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .fortune-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-light);
    }

    .fortune-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ========== 输入卡片 ========== */
    .input-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: block;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    /* 日期选择 */
    .date-selector {
      display: flex;
      gap: 8px;
    }

    .date-select {
      flex: 1;
      height: 52px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      font-size: 15px;
      color: var(--text-primary);
      text-align: center;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .date-select:focus {
      border-color: var(--primary);
    }

    .date-select option {
      background: #1a1f2e;
      color: var(--text-primary);
    }

    .date-sep {
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      font-size: 18px;
    }

    /* ========== 测算按钮 ========== */
    .calc-btn {
      width: 100%;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, #FF6B35 0%, #FF8F66 100%);
      border: none;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,107,53,0.4);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .calc-btn:active {
      transform: scale(0.98);
    }

    /* ========== 运势结果 ========== */
    .result-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      display: none;
    }

    .result-card.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: var(--primary-light);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .result-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }

    .result-item-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .result-item-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .result-item-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-light);
    }

    /* 幸运信息 */
    .lucky-info {
      background: rgba(78,205,196,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .lucky-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .lucky-row:last-child {
      border-bottom: none;
    }

    .lucky-icon {
      font-size: 24px;
      width: 40px;
      text-align: center;
    }

    .lucky-text {
      font-size: 15px;
    }

    .lucky-text span {
      color: var(--secondary);
      font-weight: 600;
    }

    /* ========== 开始按钮 ========== */
    .start-btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
      border: none;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(78,205,196,0.4);
      transition: all 0.2s;
      display: none;
    }

    .start-btn.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .resume-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      background: linear-gradient(135deg, #4ECDC4, #3DBDB5);
      border: none; color: white; font-size: 15px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .resume-btn:active { transform: scale(0.96); }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 15px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    @media (min-width: 700px) {
      .container { max-width: 640px; padding: 24px; }
      body { background: linear-gradient(135deg, #0a0e14 0%, #161B22 100%); }
    }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header">
    <h1 class="header-title">🀄 上海敲麻</h1>
    <p class="header-subtitle">好友局 - 今日麻将运势测试</p>
  </header>

  <!-- 主容器 -->
  <main class="container">
    <!-- 运势说明卡片 -->
    <div class="fortune-card">
      <div class="fortune-icon">🔮</div>
      <h2 class="fortune-title">测算今日运势</h2>
      <p class="fortune-desc">
        输入你的出生年月<br>
        看看今日麻将运势如何
      </p>
    </div>

    <!-- 输入卡片 -->
    <div class="input-card">
      <div class="input-group">
        <label class="input-label">你的昵称</label>
        <input type="text" class="input-field" id="nickname" placeholder="给自己取个好听的昵称" maxlength="10">
      </div>

      <div class="input-group">
        <label class="input-label">出生日期</label>
        <div class="date-selector">
          <select class="date-select" id="birthYear">
            <option value="">年</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="birthMonth">
            <option value="">月</option>
          </select>
          <span class="date-sep">/</span>
          <select class="date-select" id="birthDay">
            <option value="">日</option>
          </select>
        </div>
      </div>

      <button class="calc-btn" onclick="calculateFortune()">
        <span>🔮</span>
        <span>开始测算</span>
      </button>
    </div>

    <!-- 运势结果 -->
    <div class="result-card" id="resultCard">
      <h3 class="result-title" id="resultTitle">🎉 今日运势报告</h3>

      <!-- 三维评分 -->
      <div class="result-grid">
        <div class="result-item">
          <div class="result-item-icon">🍀</div>
          <div class="result-item-label">手气指数</div>
          <div class="result-item-value" id="luckScore">--</div>
        </div>
        <div class="result-item">
          <div class="result-item-icon">🧠</div>
          <div class="result-item-label">判断力</div>
          <div class="result-item-value" id="judgeScore">--</div>
        </div>
        <div class="result-item">
          <div class="result-item-icon">⚔️</div>
          <div class="result-item-label">对手运</div>
          <div class="result-item-value" id="rivalScore">--</div>
        </div>
      </div>

      <!-- 幸运信息 -->
      <div class="lucky-info">
        <div class="lucky-row">
          <div class="lucky-icon">🧭</div>
          <div class="lucky-text">幸运方位：<span id="luckyDir">--</span></div>
        </div>
        <div class="lucky-row">
          <div class="lucky-icon">🔢</div>
          <div class="lucky-text">幸运数字：<span id="luckyNum">--</span></div>
        </div>
        <div class="lucky-row">
          <div class="lucky-icon">🎨</div>
          <div class="lucky-text">幸运颜色：<span id="luckyColor">--</span></div>
        </div>
      </div>

      <button class="start-btn" id="startBtn" onclick="goToCreateRoom()">
        🎲 开始创建房间
      </button>

      <!-- 恢复上一局 -->
      <div id="resumeBar" style="display:none;margin-top:12px;">
        <button class="resume-btn" onclick="resumeGame()">
          🔄 继续上一局
        </button>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // 初始化下拉选择器
    function initSelectors() {
      // 年：1940-2010
      const yearSel = document.getElementById('birthYear');
      for (let y = 2010; y >= 1940; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        yearSel.appendChild(opt);
      }

      // 月：1-12
      const monthSel = document.getElementById('birthMonth');
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + '月';
        monthSel.appendChild(opt);
      }

      // 日：1-31
      updateDays();

      // 月份变化时更新天数
      monthSel.addEventListener('change', updateDays);
    }

    function updateDays() {
      const daySel = document.getElementById('birthDay');
      const month = parseInt(document.getElementById('birthMonth').value) || 0;
      const year = parseInt(document.getElementById('birthYear').value) || 0;

      // 清空现有选项
      daySel.innerHTML = '<option value="">日</option>';

      const daysInMonth = [31, (isLeapYear(year) ? 29 : 28), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

      const maxDay = month >= 1 && month <= 12 ? daysInMonth[month - 1] : 31;

      for (let d = 1; d <= maxDay; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d + '日';
        daySel.appendChild(opt);
      }
    }

    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    // 星座运势数据
    const fortuneData = {
      '白羊座': { luck: 85, judge: 75, rival: 70, dir: '东', num: '3,7', color: '红色' },
      '金牛座': { luck: 75, judge: 90, rival: 80, dir: '南', num: '2,6', color: '金色' },
      '双子座': { luck: 80, judge: 85, rival: 75, dir: '西', num: '5,9', color: '黄色' },
      '巨蟹座': { luck: 70, judge: 80, rival: 85, dir: '北', num: '1,4', color: '白色' },
      '狮子座': { luck: 90, judge: 70, rival: 65, dir: '东南', num: '6,8', color: '橙色' },
      '处女座': { luck: 72, judge: 95, rival: 78, dir: '东北', num: '2,5', color: '棕色' },
      '天秤座': { luck: 78, judge: 88, rival: 72, dir: '西南', num: '4,9', color: '粉色' },
      '天蝎座': { luck: 82, judge: 85, rival: 90, dir: '北', num: '1,7', color: '紫色' },
      '射手座': { luck: 88, judge: 75, rival: 68, dir: '东', num: '3,8', color: '蓝色' },
      '摩羯座': { luck: 68, judge: 92, rival: 82, dir: '南', num: '2,6', color: '灰色' },
      '水瓶座': { luck: 76, judge: 88, rival: 76, dir: '西', num: '5,7', color: '青色' },
      '双鱼座': { luck: 84, judge: 78, rival: 80, dir: '东', num: '3,9', color: '绿色' }
    };

    const constellations = [
      '白羊座', '金牛座', '双子座', '巨蟹座',
      '狮子座', '处女座', '天秤座', '天蝎座',
      '射手座', '摩羯座', '水瓶座', '双鱼座'
    ];

    function getConstellation(month, day) {
      const dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
      return month < 1 || month > 12 || day < 1 || day > 31
        ? null
        : (day < dates[month - 1] ? constellations[month - 1] : constellations[(month) % 12]);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function calculateFortune() {
      const nickname = document.getElementById('nickname').value.trim();
      const year = parseInt(document.getElementById('birthYear').value);
      const month = parseInt(document.getElementById('birthMonth').value);
      const day = parseInt(document.getElementById('birthDay').value);

      if (!nickname) {
        showToast('请输入昵称');
        return;
      }

      if (!year || !month || !day) {
        showToast('请选择完整的出生日期');
        return;
      }

      const constellation = getConstellation(month, day);
      if (!constellation) {
        showToast('日期输入有误');
        return;
      }

      const fortune = fortuneData[constellation];

      // 添加随机波动 ±10
      const random = () => Math.floor(Math.random() * 21) - 10;

      document.getElementById('luckScore').textContent = Math.min(100, Math.max(60, fortune.luck + random()));
      document.getElementById('judgeScore').textContent = Math.min(100, Math.max(60, fortune.judge + random()));
      document.getElementById('rivalScore').textContent = Math.min(100, Math.max(60, fortune.rival + random()));
      document.getElementById('luckyDir').textContent = fortune.dir;
      document.getElementById('luckyNum').textContent = fortune.num;
      document.getElementById('luckyColor').textContent = fortune.color;

      document.getElementById('resultTitle').textContent = `🎉 ${nickname}的今日运势`;
      document.getElementById('resultCard').classList.add('show');
      document.getElementById('startBtn').classList.add('show');

      // 滚动到结果
      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
    }

    function goToCreateRoom() {
      const nickname = document.getElementById('nickname').value.trim();
      showToast('即将跳转到创建房间...');
      setTimeout(() => {
        window.location.href = 'mahjong-room-create.html?nickname=' + encodeURIComponent(nickname);
      }, 1000);
    }

    function goToWaitingRoom() {
      showToast('正在创建房间...');
      setTimeout(() => {
        window.location.href = 'mahjong-waiting-room.html';
      }, 1000);
    }

    // 检查是否有未完成的对局
    function checkSavedSession() {
      const raw = localStorage.getItem('mahjongLiveSession');
      if (!raw) return;
      try {
        const session = JSON.parse(raw);
        if (session && session.players && session.records && session.players.length >= 2) {
          document.getElementById('resumeBar').style.display = 'block';
        }
      } catch(e) {}
    }

    function resumeGame() {
      // 恢复对局：直接跳转记分页（不显示密码/等待室，因为数据已有）
      // 需要构建 names 和 avatars 参数
      const raw = localStorage.getItem('mahjongLiveSession');
      if (!raw) return;
      const session = JSON.parse(raw);
      const names = session.players.map(p => p.name).join(',');
      const avatars = session.players.map(p => p.avatar).join(',');
      const cfg = session.config || {};
      const url = 'mahjong-game-score.html'
        + '?names=' + encodeURIComponent(names)
        + '&avatars=' + encodeURIComponent(avatars)
        + '&base=' + (cfg.base || 1)
        + '&multiplier=' + (cfg.multiplier || 1)
        + '&ceilingNormal=' + (cfg.ceilingNormal || 50)
        + '&score=' + (session.initialScore || 0);
      window.location.href = url;
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
      initSelectors();
      checkSavedSession();
    });
  </script>
</body>
</html>
