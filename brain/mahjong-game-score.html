<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>上海敲麻 - 游戏记分</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #FF6B35;
      --primary-light: #FF8F66;
      --secondary: #4ECDC4;
      --danger: #FF6B6B;
      --success: #51CF66;
      --bg-dark: #0D1117;
      --bg-card: #161B22;
      --text-primary: #FFFFFF;
      --text-secondary: #8B949E;
      --border: #30363D;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: calc(320px + env(safe-area-inset-bottom));
    }

    /* ========== 头部 ========== */
    .header {
      background: linear-gradient(180deg, #1a1f2e 0%, var(--bg-dark) 100%);
      padding: 16px 16px 12px;
      text-align: center;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .round-info {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,107,53,0.15);
      border: 1px solid rgba(255,107,53,0.3);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--primary-light);
    }

    /* ========== 规则摘要栏 ========== */
    .rules-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }

    .rules-bar .rule-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rules-bar .rule-val {
      color: var(--primary-light);
      font-weight: 600;
    }

    /* ========== 语音按钮 ========== */
    .voice-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      gap: 10px;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 24px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--secondary), #3DBDB5);
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      touch-action: manipulation;
    }
    .voice-btn:active {
      transform: scale(0.95);
    }
    .voice-btn.recording {
      background: linear-gradient(135deg, var(--danger), #FF4444);
      animation: pulse-mic 1.2s ease-in-out infinite;
    }
    @keyframes pulse-mic {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.5); }
      50% { box-shadow: 0 0 0 14px rgba(255,107,107,0); }
    }

    .voice-status {
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 18px;
      text-align: center;
    }

    /* ========== 玩家积分 ========== */
    .players-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    .player-score-card {
      text-align: center;
      padding: 10px 2px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .player-score-card.selected-winner {
      border-color: var(--primary);
      background: rgba(255,107,53,0.1);
    }

    .player-score-card.selected-dianpao {
      border-color: var(--danger);
      background: rgba(255,107,107,0.1);
    }

    .dealer-badge {
      position: absolute;
      top: -6px;
      right: -4px;
      background: var(--primary);
      color: white;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 6px;
      font-weight: 600;
    }

    .player-position {
      font-size: 10px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .player-avatar {
      font-size: 22px;
      margin-bottom: 2px;
    }

    .player-name {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-score {
      font-size: 16px;
      font-weight: 700;
    }

    .player-score.positive { color: var(--success); }
    .player-score.negative { color: var(--danger); }
    .player-score.zero { color: var(--text-primary); }

    /* ========== 主体区域 ========== */
    .main-section {
      padding: 16px;
      margin: 0 auto;
      max-width: 520px;
    }

    .section-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      min-height: 18px;
    }

    /* ========== 花数输入 ========== */
    .flower-section {
      margin-bottom: 16px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .flower-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .flower-label {
      font-size: 14px;
      color: var(--text-primary);
    }

    .flower-stepper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flower-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .flower-btn:active {
      background: rgba(255,107,53,0.2);
    }

    .flower-value {
      font-size: 20px;
      font-weight: 700;
      min-width: 32px;
      text-align: center;
    }

    /* ========== 快捷按钮 ========== */
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-btn {
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn.active {
      background: rgba(255,107,53,0.2);
      border-color: var(--primary);
      color: var(--primary-light);
    }

    .quick-btn.no-dianpao {
      border-style: dashed;
    }

    .quick-btn:active {
      transform: scale(0.95);
    }

    /* ========== 操作区 ========== */
    .action-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent 0%, var(--bg-dark) 30%);
    }

    .selected-info {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .selected-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .selected-row:last-child {
      margin-bottom: 0;
    }

    .selected-label {
      color: var(--text-secondary);
    }

    .selected-value {
      color: var(--primary-light);
      font-weight: 600;
    }

    .score-preview {
      text-align: center;
      padding: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .score-preview.show {
      opacity: 1;
    }

    .score-preview-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .score-preview-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-light);
    }

    .confirm-btn {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,107,53,0.3);
      transition: all 0.2s;
    }

    .confirm-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .confirm-btn:not(:disabled):active {
      transform: scale(0.98);
    }

    /* ========== 记录列表 ========== */
    .records-section {
      padding: 0 16px;
    }

    .records-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .records-clear {
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .record-item {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .record-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .record-content {
      flex: 1;
      min-width: 0;
    }

    .record-desc {
      font-size: 14px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-time {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========== 结束按钮 ========== */
    .end-section {
      padding: 16px;
    }

    .end-game-btn {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      background: transparent;
      border: 1px solid rgba(255,107,107,0.5);
      color: var(--danger);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .end-game-btn:active {
      background: rgba(255,107,107,0.1);
      transform: scale(0.98);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 15px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
      max-width: 80vw;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .no-records {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
      font-size: 14px;
    }

    /* ========== 结束确认弹窗 ========== */
    .end-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .end-overlay.show {
      display: flex;
    }
    .end-dialog {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 32px 24px 24px;
      width: 320px;
      border: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }
    .end-dialog-icon {
      text-align: center;
      font-size: 48px;
      margin-bottom: 16px;
    }
    .end-dialog-title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .end-dialog-desc {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .end-dialog-btns {
      display: flex;
      gap: 12px;
    }
    .end-dialog-btn {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .end-dialog-btn:active {
      transform: scale(0.97);
    }
    .end-dialog-btn.cancel {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .end-dialog-btn.confirm {
      background: linear-gradient(135deg, var(--danger), #FF4444);
      color: white;
    }
    @media (min-width: 700px) {
      .main-section { max-width: 640px; padding: 24px; }
      body { background: linear-gradient(135deg, #0a0e14 0%, #161B22 100%); }
    }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header">
    <h1 class="header-title">🀄 游戏进行中</h1>
    <div class="header-subtitle">上海敲麻-好友局</div>
    <div class="round-info">
      <span>🎯</span>
      <span id="roundText">第1局</span>
    </div>
  </header>

  <!-- 规则摘要栏 -->
  <div class="rules-bar" id="rulesBar">
    <div class="rule-item">底：<span class="rule-val" id="ruleBase">1</span></div>
    <div class="rule-item">全场倍数：<span class="rule-val" id="ruleMultiplier">5</span></div>
    <div class="rule-item">普通封顶：<span class="rule-val" id="ruleCeilingNormal">50</span></div>
    <div class="rule-item">开宝封顶：<span class="rule-val" id="ruleCeilingKaibao">100</span></div>
  </div>

  <!-- 语音录入区 -->
  <div class="voice-bar">
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
      <span id="voiceBtnText">🎤 点我录音</span>
    </button>
  </div>
  <div class="voice-status" id="voiceStatus">点击录音后说话，再点结束识别</div>

  <!-- 玩家积分 -->
  <div class="players-bar" id="playersBar"></div>

  <!-- 主体：所有按钮直接显示 -->
  <div class="main-section">
    <!-- 局类型选择 -->
    <div class="section-label">🎯 局类型</div>
    <div class="quick-buttons" id="gameTypeButtons" style="margin-bottom: 16px;">
      <button class="quick-btn active" onclick="setGameType('normal')">普通局</button>
      <button class="quick-btn" onclick="setGameType('kaibao')">开宝局</button>
    </div>

    <!-- 选择牌型（多选）放到胡牌人上方 -->
    <div class="section-label">📋 选择牌型（可多选）</div>
    <div class="hint-text" id="patternHint">点击选择，再次点击取消</div>
    <div class="quick-buttons" id="patternButtons"></div>

    <!-- 花数输入 -->
    <div class="flower-section" style="margin-top: 16px;">
      <div class="flower-row">
        <div class="flower-label">🌸 花数 <span id="flowerLockHint" style="display:none; font-size:12px; color:var(--text-secondary);">(无花果已锁定为0)</span></div>
        <div class="flower-stepper" id="flowerStepper">
          <button class="flower-btn" id="flowerMinusBtn" onclick="changeFlower(-1)">−</button>
          <span class="flower-value" id="flowerValue">0</span>
          <button class="flower-btn" id="flowerPlusBtn" onclick="changeFlower(1)">+</button>
        </div>
      </div>
    </div>

    <!-- 选择胡牌人 -->
    <div class="section-label" style="margin-top: 16px;">👤 选择胡牌人</div>
    <div class="hint-text" id="winnerHint">请选择胡牌的人</div>
    <div class="quick-buttons" id="winnerButtons"></div>

    <!-- 选择点炮人（仅非自摸、且花数≥2时需要） -->
    <div id="dianpaoSection" style="display:none; margin-top: 16px;">
      <div class="section-label">💥 选择点炮人</div>
      <div class="hint-text" id="dianpaoHint">请选择点炮的人（1花只能自摸）</div>
      <div class="quick-buttons" id="dianpaoButtons"></div>
    </div>
  </div>

  <!-- 操作区 -->
  <div class="action-section">
    <div class="selected-info" id="selectedInfo">
      <div class="selected-row">
        <span class="selected-label">胡牌人：</span>
        <span class="selected-value" id="infoWinner">未选择</span>
      </div>
      <div class="selected-row">
        <span class="selected-label">花数：</span>
        <span class="selected-value" id="infoFlower">0</span>
      </div>
      <div class="selected-row">
        <span class="selected-label">牌型：</span>
        <span class="selected-value" id="infoPattern">未选择</span>
      </div>
      <div class="selected-row" id="infoDianpaoRow" style="display:none;">
        <span class="selected-label">点炮人：</span>
        <span class="selected-value" id="infoDianpao">未选择</span>
      </div>
    </div>

    <div class="score-preview" id="scorePreview">
      <div class="score-preview-text">预估分数变化</div>
      <div class="score-preview-value" id="scorePreviewValue">+0</div>
    </div>

    <button class="confirm-btn" id="confirmBtn" disabled onclick="confirmScore()">确认记分</button>

    <button class="end-game-btn" onclick="endGame()">🏁 结束对局</button>
  </div>

  <!-- 记录列表 -->
  <div class="records-section">
    <div class="records-title">
      <span>📝 记分记录</span>
      <span class="records-clear" onclick="clearRecords()">清空</span>
    </div>
    <div id="recordsList">
      <div class="no-records">暂无记录，开始记分吧</div>
    </div>
  </div>

  <!-- 结束确认弹窗 -->
  <div class="end-overlay" id="endOverlay" onclick="closeEndConfirm(event)">
    <div class="end-dialog" onclick="event.stopPropagation()">
      <div class="end-dialog-icon">🏁</div>
      <div class="end-dialog-title">结束游戏？</div>
      <div class="end-dialog-desc">确定后将对局数据汇总到总结页面，<br>中途退出后不可恢复。</div>
      <div class="end-dialog-btns">
        <button class="end-dialog-btn cancel" onclick="closeEndConfirm()">取消</button>
        <button class="end-dialog-btn confirm" onclick="confirmEndGame()">确定结束</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ========== 玩家数据 ==========
    // 玩家信息从 URL 参数读取，如果没有则使用默认值
    let players = [];

    // ========== 游戏设置（从创建房间传来）==========
    let gameConfig = {
      base: 1,
      multiplier: 5,
      ceilingNormal: 50,
      ceilingKaibaoMultiplier: 2,
      menqingMultiplier: 2,
      zimoMultiplier: 3,
    };

    // ========== 局类型 ==========
    let gameType = 'normal';

    // ========== 牌型数据 ==========
    let patterns = [];

    // ========== 状态 ==========
    let state = {
      selectedWinner: null,
      selectedPatterns: [],
      selectedDianpao: null,
      flowerCount: 0,
      round: 1,
      lastScoreRound: 0,
    };

    let records = [];

    // ========== 语音识别 ==========
    let recognition = null;
    let isListening = false;
    let _gotResult = false;
    let _micGranted = false;  // 是否已获得麦克风权限

    // ========== 初始化 ==========
    function init() {
      const params = new URLSearchParams(window.location.search);

      // 读取玩家信息
      readPlayersFromParams(params);

      // 读取游戏设置
      gameConfig.base = parseInt(params.get('base')) || 1;
      gameConfig.multiplier = parseInt(params.get('multiplier')) || 5;
      gameConfig.ceilingNormal = parseInt(params.get('ceilingNormal')) || 50;
      gameConfig.ceilingKaibaoMultiplier = parseInt(params.get('ceilingKaibao')) || 2;

      // 初始积分
      const initialScore = parseInt(params.get('score')) || 0;
      gameConfig.initialScore = initialScore;
      players.forEach(p => { p.score = initialScore; });

      // 更新规则摘要栏
      document.getElementById('ruleBase').textContent = gameConfig.base;
      document.getElementById('ruleMultiplier').textContent = gameConfig.multiplier;
      document.getElementById('ruleCeilingNormal').textContent = gameConfig.ceilingNormal;
      updateCeilingKaibaoDisplay();

      // 解析牌型设置
      const roomPatterns = {
        '碰碰胡':   { val: parseInt(params.get('pengpeng'))   || 0, isMultiplier: true },
        '清一色':   { val: parseInt(params.get('qingyise'))   || 0, isMultiplier: true },
        '混一色':   { val: parseInt(params.get('hunyise'))   || 0, isMultiplier: true },
        '平胡':     { val: parseInt(params.get('pinghu'))    || 0, isMultiplier: true },
        '杠开':     { val: parseInt(params.get('gangkai'))    || 0, isMultiplier: true },
        '七小对':   { val: parseInt(params.get('qixiaodui')) || 0, isMultiplier: true },
        '开宝':     { val: parseInt(params.get('kaibao'))    || 0, isMultiplier: true },
        '无花果':   { val: parseInt(params.get('wuhuaguo'))  || 0, isMultiplier: false },
        '天胡':     { val: parseInt(params.get('tianhu'))    || 0, isMultiplier: false, isNaturalWin: true, noCeiling: true },
        '地胡':     { val: parseInt(params.get('dihu'))      || 0, isMultiplier: false, isNaturalWin: true, noCeiling: true },
        '花胡':     { val: parseInt(params.get('huahu'))     || 0, isMultiplier: false, isHuahu: true },
      };

      patterns = [];
      for (const [name, { val, isMultiplier, isNaturalWin, noCeiling, isHuahu }] of Object.entries(roomPatterns)) {
        if (val > 0) {
          if (isMultiplier) {
            patterns.push({ name, multiplier: val, isMultiplier: true });
          } else {
            patterns.push({ name, score: val, isMultiplier: false, isNaturalWin: !!isNaturalWin, noCeiling: !!noCeiling, isHuahu: !!isHuahu });
          }
        }
      }
      patterns.push({ name: '自摸', multiplier: gameConfig.zimoMultiplier, isMultiplier: true, isZimo: true });
      patterns.push({ name: '门清', multiplier: gameConfig.menqingMultiplier, isMultiplier: true, isMenqing: true });

      renderPlayers();
      renderWinnerButtons();
      renderPatternButtons();
      updateDianpaoSection();
      updateConfirmBtn();
      initSpeechRecognition();
      // 预先请求麦克风权限（不影响语音同步启动）
      preRequestMic();
    }

    // ========== 预先请求麦克风权限 ==========
    function preRequestMic() {
      if (_micGranted || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          stream.getTracks().forEach(track => track.stop());
          _micGranted = true;
        })
        .catch(function() {});
    }

    // ========== 从 URL 参数读取玩家信息 ==========
    function readPlayersFromParams(params) {
      const names  = params.get('names')  ? params.get('names').split(',')  : [];
      const avatars = params.get('avatars') ? params.get('avatars').split(',') : [];
      const positions = ['东', '南', '西', '北'];

      if (names.length === 4) {
        players = names.map((name, i) => ({
          id: 'player' + i,
          name: name,
          avatar: avatars[i] || ['😎','🐱','🐶','🦁'][i],
          position: positions[i],
          score: 0,
        }));
      } else {
        // 默认值
        players = [
          { id: 'player0', name: '我',   avatar: '😎', position: '东', score: 0 },
          { id: 'player1', name: '小明', avatar: '🐱', position: '南', score: 0 },
          { id: 'player2', name: '阿强', avatar: '🐶', position: '西', score: 0 },
          { id: 'player3', name: '老王', avatar: '🦁', position: '北', score: 0 },
        ];
      }
    }

    // ========== 更新开宝封顶显示 ==========
    function updateCeilingKaibaoDisplay() {
      const val = gameConfig.ceilingNormal * gameConfig.ceilingKaibaoMultiplier;
      document.getElementById('ruleCeilingKaibao').textContent = val;
    }

    // ========== 渲染玩家积分 ==========
    function renderPlayers() {
      const bar = document.getElementById('playersBar');
      bar.innerHTML = '';
      players.forEach(p => {
        let cardClass = 'player-score-card';
        if (p.id === state.selectedWinner) cardClass += ' selected-winner';
        if (p.id === state.selectedDianpao) cardClass += ' selected-dianpao';

        const card = document.createElement('div');
        card.className = cardClass;

        let scoreClass = 'zero';
        if (p.score > 0) scoreClass = 'positive';
        else if (p.score < 0) scoreClass = 'negative';

        card.innerHTML = `
          <div class="player-position">${p.position}</div>
          <div class="player-avatar">${p.avatar}</div>
          <div class="player-name">${p.name}</div>
          <div class="player-score ${scoreClass}">${p.score > 0 ? '+' : ''}${p.score}</div>
        `;
        bar.appendChild(card);
      });
    }

    // ========== 渲染胡牌人按钮 ==========
    function renderWinnerButtons() {
      const container = document.getElementById('winnerButtons');
      container.innerHTML = '';
      players.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn' + (state.selectedWinner === p.id ? ' active' : '');
        btn.innerHTML = `<span>${p.avatar} ${p.name}</span>`;
        btn.onclick = () => selectWinner(p.id);
        container.appendChild(btn);
      });
    }

    // ========== 渲染牌型按钮（多选）==========
    function renderPatternButtons() {
      const container = document.getElementById('patternButtons');
      container.innerHTML = '';
      patterns.forEach(p => {
        const isSelected = state.selectedPatterns.some(sp => sp.name === p.name);
        const btn = document.createElement('button');
        let className = 'quick-btn';
        if (isSelected) className += ' active';
        btn.className = className;

        let btnText = p.name;
        if (p.isMultiplier && p.multiplier > 0) {
          btnText += ` ${p.multiplier}倍`;
        } else if (p.isHuahu && p.score > 0) {
          btnText += ` ${p.score}个花`;
        } else if (!p.isMultiplier && p.score > 0) {
          btnText += ` ${p.score}分`;
        }
        btn.innerHTML = `<span>${btnText}</span>`;
        btn.onclick = () => togglePattern(p.name);
        container.appendChild(btn);
      });
    }

    // ========== 渲染点炮人按钮 ==========
    function renderDianpaoButtons() {
      const container = document.getElementById('dianpaoButtons');
      container.innerHTML = '';
      players.forEach(p => {
        if (p.id === state.selectedWinner) return;
        const btn = document.createElement('button');
        btn.className = 'quick-btn' + (state.selectedDianpao === p.id ? ' active' : '');
        btn.innerHTML = `<span>${p.avatar} ${p.name}</span>`;
        btn.onclick = () => selectDianpao(p.id);
        container.appendChild(btn);
      });
    }

    // ========== 更新点炮人区域显示/隐藏 ==========
    function updateDianpaoSection() {
      const section = document.getElementById('dianpaoSection');
      const hasZimo = state.selectedPatterns.some(p => p.isZimo);
      const hasNatural = state.selectedPatterns.some(p => p.isNaturalWin);
      const hasHuahu = state.selectedPatterns.some(p => p.isHuahu);
      const isOneFlowerNoMenqing = state.flowerCount === 1 && !state.selectedPatterns.some(p => p.isMenqing);
      if (hasZimo || hasNatural || hasHuahu || isOneFlowerNoMenqing) {
        section.style.display = 'none';
      } else {
        section.style.display = 'block';
        renderDianpaoButtons();
      }
    }

    // ========== 花数调整 ==========
    function isFlowerLocked() {
      const hasWuhuaguo = state.selectedPatterns.some(p => p.name === '无花果');
      const hasHuahu = state.selectedPatterns.some(p => p.name === '花胡');
      return hasWuhuaguo || hasHuahu;
    }

    function getFlowerLockReason() {
      if (state.selectedPatterns.some(p => p.name === '无花果')) return '无花果模式下花数强制为0';
      if (state.selectedPatterns.some(p => p.name === '花胡')) {
        const huahu = state.selectedPatterns.find(p => p.name === '花胡');
        return `花胡模式下花数固定为${huahu?.score || 0}`;
      }
      return '';
    }

    function updateFlowerLock() {
      const locked = isFlowerLocked();
      const huahu = state.selectedPatterns.find(p => p.name === '花胡');
      if (huahu) {
        // 花胡锁定，显示花胡的花数
        document.getElementById('flowerLockHint').textContent = `(花胡已锁定花数为${huahu.score})`;
      } else if (state.selectedPatterns.some(p => p.name === '无花果')) {
        document.getElementById('flowerLockHint').textContent = '(无花果已锁定为0)';
      }
      document.getElementById('flowerLockHint').style.display = locked ? 'inline' : 'none';
      document.getElementById('flowerMinusBtn').style.opacity = locked ? '0.3' : '1';
      document.getElementById('flowerMinusBtn').style.pointerEvents = locked ? 'none' : 'auto';
      document.getElementById('flowerPlusBtn').style.opacity = locked ? '0.3' : '1';
      document.getElementById('flowerPlusBtn').style.pointerEvents = locked ? 'none' : 'auto';
    }

    function changeFlower(delta) {
      if (isFlowerLocked()) {
        showToast(getFlowerLockReason());
        return;
      }
      const oldCount = state.flowerCount;
      state.flowerCount = Math.max(0, state.flowerCount + delta);
      document.getElementById('flowerValue').textContent = state.flowerCount;
      document.getElementById('infoFlower').textContent = state.flowerCount;

      // 1花只能自摸（门清除外：门清1花可以胡别人）
      const isOneFlowerNoMenqing = state.flowerCount === 1 && !state.selectedPatterns.some(p => p.isMenqing);
      if (isOneFlowerNoMenqing && oldCount !== 1) {
        const zimoPat = patterns.find(p => p.isZimo);
        if (zimoPat && !state.selectedPatterns.some(p => p.isZimo)) {
          state.selectedPatterns.push(zimoPat);
          // 自动选中胡牌人
          if (!state.selectedWinner) {
            state.selectedWinner = players[0]?.id || 'player0';
            document.getElementById('winnerHint').textContent = `✅ 已选择：${players.find(p => p.id === state.selectedWinner)?.name || '自己'}`;
          }
          // 清空点炮选择
          state.selectedDianpao = null;
          renderPatternButtons();
          renderPlayers();
          renderWinnerButtons();
        }
      }

      // 花数离开1时，移除之前自动选中的自摸
      if (oldCount === 1 && state.flowerCount !== 1) {
        const zimoIdx = state.selectedPatterns.findIndex(p => p.isZimo);
        if (zimoIdx >= 0 && !isOneFlowerNoMenqing) {
          state.selectedPatterns.splice(zimoIdx, 1);
          state.selectedDianpao = null;
          renderPatternButtons();
          renderPlayers();
          renderWinnerButtons();
        }
      }

      updateDianpaoSection();
      updateFlowerLock();
      updateSelectedInfo();
      updateScorePreview();
      updateConfirmBtn();
      showToast(`花数：${state.flowerCount}${state.flowerCount === 1 && !state.selectedPatterns.some(p => p.isMenqing) ? '（1花只能自摸，门清除外）' : ''}`);
    }

    // ========== 选择胡牌人 ==========
    function selectWinner(playerId) {
      if (state.selectedWinner === playerId) {
        state.selectedWinner = null;
        document.getElementById('winnerHint').textContent = '请选择胡牌的人';
      } else {
        state.selectedWinner = playerId;
        document.getElementById('winnerHint').textContent = `✅ 已选择：${players.find(p => p.id === playerId).name}`;
      }
      renderPlayers();
      renderWinnerButtons();
      updateSelectedInfo();
      updateScorePreview();
      updateConfirmBtn();
    }

    // ========== 切换牌型选择（多选）==========
    function togglePattern(patternName) {
      const pattern = patterns.find(p => p.name === patternName);
      const idx = state.selectedPatterns.findIndex(p => p.name === patternName);
      const wasSelected = idx >= 0;
      if (wasSelected) {
        state.selectedPatterns.splice(idx, 1);
        // 取消杠开时也取消自摸（如果自摸是杠开带上的）
        if (patternName === '杠开') {
          const zimoIdx = state.selectedPatterns.findIndex(p => p.name === '自摸');
          if (zimoIdx >= 0) {
            state.selectedPatterns.splice(zimoIdx, 1);
          }
        }
      } else {
        state.selectedPatterns.push(pattern);
        // 选无花果时花数归零
        if (patternName === '无花果') {
          state.flowerCount = 0;
          document.getElementById('flowerValue').textContent = '0';
        }
        // 选花胡时花数设为花胡的分数值
        if (patternName === '花胡' && pattern.score !== undefined) {
          state.flowerCount = pattern.score;
          document.getElementById('flowerValue').textContent = pattern.score;
        }
        // 选自摸时默认胡牌人是自己（player0）
        if (pattern.isZimo && !state.selectedWinner) {
          state.selectedWinner = players[0]?.id || 'player0';
          document.getElementById('winnerHint').textContent = `✅ 已选择：${players.find(p => p.id === state.selectedWinner)?.name || '自己'}`;
        }
        // 选杠开时自动勾选自摸（杠开必定自摸）
        if (patternName === '杠开') {
          const zimoPat = patterns.find(p => p.isZimo);
          if (zimoPat && !state.selectedPatterns.some(p => p.isZimo)) {
            state.selectedPatterns.push(zimoPat);
            if (!state.selectedWinner) {
              state.selectedWinner = players[0]?.id || 'player0';
              document.getElementById('winnerHint').textContent = `✅ 已选择：${players.find(p => p.id === state.selectedWinner)?.name || '自己'}`;
            }
          }
        }
      }

      // 门清切换时的1花规则处理
      if (patternName === '门清' && state.flowerCount === 1) {
        const isOneFlowerNoMenqing = !state.selectedPatterns.some(p => p.isMenqing);
        if (isOneFlowerNoMenqing) {
          // 取消了门清，1花强制自摸
          const zimoPat = patterns.find(p => p.isZimo);
          if (zimoPat && !state.selectedPatterns.some(p => p.isZimo)) {
            state.selectedPatterns.push(zimoPat);
          }
          state.selectedDianpao = null;
        }
      }
      renderPatternButtons();
      renderPlayers();
      renderWinnerButtons();
      updateDianpaoSection();
      updateFlowerLock();
      updateSelectedInfo();
      updateScorePreview();
      updateConfirmBtn();
    }

    // ========== 选择点炮人 ==========
    function selectDianpao(playerId) {
      const isOneFlowerNoMenqing = state.flowerCount === 1 && !state.selectedPatterns.some(p => p.isMenqing);
      if (isOneFlowerNoMenqing) {
        showToast('1花只能自摸（门清除外）');
        return;
      }
      if (state.selectedDianpao === playerId) {
        state.selectedDianpao = null;
        document.getElementById('infoDianpao').textContent = '未选择';
      } else {
        state.selectedDianpao = playerId;
        document.getElementById('infoDianpao').textContent = players.find(p => p.id === playerId).name;
      }
      renderPlayers();
      renderDianpaoButtons();
      updateSelectedInfo();
      updateScorePreview();
      updateConfirmBtn();
    }

    // ========== 计算分数 ==========
    // 公式：
    //   基数 = 有固定分牌型 ? (固定分基准分(取最高) + 底) : (底 + 花数)
    //   结果 = 基数 × 全场倍数 × 所有选中的倍数牌型连乘
    //   天胡/地胡（自然胡）：各减牌型分（如150），winner得牌型分×3
    //   花胡：得分 = 封顶×3，各减1个封顶
    //   普通胡：每家扣分 = min(结果, 封顶)，自摸×3，点炮×1
    function calculateScore() {
      if (!state.selectedWinner || state.selectedPatterns.length === 0) return { score: 0, perPerson: 0 };

      const ceiling = getCeiling();

      // 花胡特殊计分：总分 = 封顶×3，各减1个封顶
      const hasHuahu = state.selectedPatterns.some(p => p.isHuahu);
      if (hasHuahu) {
        return { score: ceiling * 3, perPerson: ceiling, isNaturalWin: false };
      }

      // 固定分牌型（无花果/天胡/地胡）
      const fixedPatterns = state.selectedPatterns.filter(p => !p.isMultiplier && p.score > 0);
      const hasFixed = fixedPatterns.length > 0;

      // 基数：固定分牌型取最高分 + 底，否则取(底 + 花数)
      let baseValue = hasFixed
        ? Math.max(...fixedPatterns.map(p => p.score)) + gameConfig.base
        : (gameConfig.base + state.flowerCount);

      // 乘全场倍数和所有倍数牌型（排除自摸，自摸的×3在总分计算中单独处理）
      let totalMultiplier = gameConfig.multiplier;  // 全场倍数
      state.selectedPatterns.forEach(p => {
        if (p.isMultiplier && p.multiplier > 0 && !p.isZimo) {
          totalMultiplier *= p.multiplier;
        }
      });

      const rawScore = baseValue * totalMultiplier;

      // 天胡/地胡（自然胡）：各减牌型分，winner得牌型分×3（不加底、不乘倍数、不封顶）
      const hasNaturalWin = state.selectedPatterns.some(p => p.isNaturalWin);
      if (hasNaturalWin) {
        const naturalScore = Math.max(...state.selectedPatterns.filter(p => p.isNaturalWin).map(p => p.score));
        return { score: naturalScore * 3, perPerson: naturalScore, isNaturalWin: true };
      }

      // 普通胡逻辑
      const perPerson = Math.min(rawScore, ceiling);
      const hasZimo = state.selectedPatterns.some(p => p.isZimo);
      const totalScore = hasZimo ? perPerson * 3 : perPerson;

      return { score: totalScore, perPerson: perPerson, isNaturalWin: false };
    }

    // ========== 更新已选信息 ==========
    function updateSelectedInfo() {
      if (state.selectedWinner) {
        document.getElementById('infoWinner').textContent = players.find(p => p.id === state.selectedWinner).name;
      } else {
        document.getElementById('infoWinner').textContent = '未选择';
      }

      if (state.selectedPatterns.length > 0) {
        const names = state.selectedPatterns.map(p => {
          let s = p.name;
          if (p.isMultiplier && p.multiplier > 0) s += `${p.multiplier}倍`;
          else if (p.isHuahu && p.score > 0) s += `${p.score}个花`;
          else if (!p.isMultiplier && p.score > 0) s += `${p.score}分`;
          return s;
        });
        document.getElementById('infoPattern').textContent = names.join(' + ');
      } else {
        document.getElementById('infoPattern').textContent = '未选择';
      }

      const hasZimo = state.selectedPatterns.some(p => p.isZimo);
      if (!hasZimo) {
        document.getElementById('infoDianpaoRow').style.display = 'flex';
        if (state.selectedDianpao) {
          document.getElementById('infoDianpao').textContent = players.find(p => p.id === state.selectedDianpao).name;
        } else {
          document.getElementById('infoDianpao').textContent = '未选择';
        }
      } else {
        document.getElementById('infoDianpaoRow').style.display = 'none';
      }
    }

    // ========== 更新分数预览 ==========
    function updateScorePreview() {
      const preview = document.getElementById('scorePreview');
      if (!state.selectedWinner || state.selectedPatterns.length === 0) {
        preview.classList.remove('show');
        return;
      }
      const hasZimo = state.selectedPatterns.some(p => p.isZimo);
      const hasNatural = state.selectedPatterns.some(p => p.isNaturalWin);
      const hasHuahu = state.selectedPatterns.some(p => p.isHuahu);
      if (!hasZimo && !hasNatural && !hasHuahu && !state.selectedDianpao) {
        preview.classList.remove('show');
        return;
      }

      preview.classList.add('show');

      const winner = players.find(p => p.id === state.selectedWinner);
      const { score, perPerson } = calculateScore();

      let previewText = '';
      if (hasNatural) {
        previewText = `${winner.name} +${score}（天胡/地胡×3），其他各 -${perPerson}`;
      } else if (hasHuahu) {
        previewText = `${winner.name} +${score}（花胡封顶×3），其他各 -${perPerson}`;
      } else if (hasZimo) {
        previewText = `${winner.name} +${score}，其他各 -${perPerson}`;
      } else {
        const dianpao = players.find(p => p.id === state.selectedDianpao);
        previewText = `${winner.name} +${perPerson}，${dianpao.name} -${perPerson}`;
      }

      document.getElementById('scorePreviewValue').textContent = previewText;
    }

    // ========== 设置局类型 ==========
    function setGameType(type) {
      gameType = type;
      document.querySelectorAll('#gameTypeButtons .quick-btn').forEach(btn => {
        btn.classList.toggle('active',
          (type === 'normal' && btn.textContent === '普通局') ||
          (type === 'kaibao' && btn.textContent === '开宝局')
        );
      });

      // 开宝局：自动勾选开宝牌型；普通局：取消勾选开宝
      const kaibaoPat = patterns.find(p => p.name === '开宝');
      if (!kaibaoPat) { updateScorePreview(); return; }
      const idx = state.selectedPatterns.findIndex(p => p.name === '开宝');
      if (type === 'kaibao' && idx < 0) {
        state.selectedPatterns.push(kaibaoPat);
        renderPatternButtons();
        updateDianpaoSection();
      } else if (type === 'normal' && idx >= 0) {
        state.selectedPatterns.splice(idx, 1);
        renderPatternButtons();
        updateDianpaoSection();
      }

      // 更新规则栏开宝封顶显示
      updateCeilingKaibaoDisplay();
      updateSelectedInfo();
      updateScorePreview();
    }

    // ========== 获取当前局封顶分数 ==========
    function getCeiling() {
      if (gameType === 'kaibao') {
        return gameConfig.ceilingNormal * gameConfig.ceilingKaibaoMultiplier;
      }
      return gameConfig.ceilingNormal;
    }

    // ========== 更新确认按钮 ==========
    function updateConfirmBtn() {
      const btn = document.getElementById('confirmBtn');
      let canConfirm = false;

      if (state.selectedWinner && state.selectedPatterns.length > 0) {
        const hasZimo = state.selectedPatterns.some(p => p.isZimo);
        const hasNatural = state.selectedPatterns.some(p => p.isNaturalWin);
        const hasHuahu = state.selectedPatterns.some(p => p.isHuahu);
        if (hasZimo || hasNatural || hasHuahu) {
          canConfirm = true;
        } else {
          canConfirm = state.selectedDianpao && state.selectedDianpao !== state.selectedWinner;
        }
      }

      btn.disabled = !canConfirm;
    }

    // ========== 确认记分 ==========
    function confirmScore() {
      if (!state.selectedWinner || state.selectedPatterns.length === 0) return;
      const hasZimo = state.selectedPatterns.some(p => p.isZimo);
      const hasNatural = state.selectedPatterns.some(p => p.isNaturalWin);
      const hasHuahu = state.selectedPatterns.some(p => p.isHuahu);
      if (!hasZimo && !hasNatural && !hasHuahu && !state.selectedDianpao) return;

      if (state.round <= state.lastScoreRound) {
        showToast('本局已记分，请勿重复操作');
        return;
      }

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      const winner = players.find(p => p.id === state.selectedWinner);
      const { score, perPerson } = calculateScore();

      const patternDesc = state.selectedPatterns.map(p => p.name).join('+');
      let desc = '';
      let icon = '🎯';

      if (hasHuahu) {
        // 花胡：winner拿封顶×3，其他各减1个封顶
        players.forEach(p => {
          if (p.id === state.selectedWinner) {
            p.score += score;
          } else {
            p.score -= perPerson;
          }
        });
        desc = `${winner.name} ${patternDesc}（花胡封顶×3）`;
        icon = '🌺';
      } else if (hasNatural) {
        // 天胡/地胡（自然胡）：各减牌型分，winner得牌型分×3
        players.forEach(p => {
          if (p.id === state.selectedWinner) {
            p.score += score;
          } else {
            p.score -= perPerson;
          }
        });
        desc = `${winner.name} ${patternDesc}（自然胡）`;
        icon = '🌟';
      } else if (hasZimo) {
        // 自摸：winner拿总分，其他各减
        players.forEach(p => {
          if (p.id === state.selectedWinner) {
            p.score += score;
          } else {
            p.score -= perPerson;
          }
        });
        desc = `${winner.name} ${patternDesc}（自摸）`;
        icon = '🎯';
      } else {
        const dianpao = players.find(p => p.id === state.selectedDianpao);
        winner.score += perPerson;
        dianpao.score -= perPerson;
        desc = `${winner.name} ${patternDesc}（${dianpao.name}点炮）`;
        icon = '💥';
      }

      records.unshift({
        icon: icon,
        desc: desc,
        time: timeStr,
        scores: players.map(p => ({ name: p.name, score: p.score, avatar: p.avatar })),
      });

      state.lastScoreRound = state.round;

      renderPlayers();
      renderRecords();

      state.round++;
      document.getElementById('roundText').textContent = `第${state.round}局`;

      // 自动保存当前对局（防止误关页面）
      saveCurrentSession();

      resetSelection();

      showToast(`记分成功！已进入第${state.round}局`);
    }

    // ========== 重置选择 ==========
    function resetSelection() {
      state.selectedWinner = null;
      state.selectedPatterns = [];
      state.selectedDianpao = null;
      state.flowerCount = 0;
      document.getElementById('flowerValue').textContent = '0';
      document.getElementById('winnerHint').textContent = '请选择胡牌的人';
      renderPlayers();
      renderWinnerButtons();
      renderPatternButtons();
      updateDianpaoSection();
      updateFlowerLock();
      updateSelectedInfo();
      updateScorePreview();
      updateConfirmBtn();
    }

    // ========== 渲染记录 ==========
    function renderRecords() {
      const list = document.getElementById('recordsList');
      if (records.length === 0) {
        list.innerHTML = '<div class="no-records">暂无记录，开始记分吧</div>';
        return;
      }
      list.innerHTML = '';
      records.forEach(r => {
        const item = document.createElement('div');
        item.className = 'record-item';
        item.innerHTML = `
          <div class="record-icon">${r.icon}</div>
          <div class="record-content">
            <div class="record-desc">${r.desc}</div>
            <div class="record-time">${r.time}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    // ========== 清空记录 ==========
    function clearRecords() {
      if (confirm('确定要清空所有记录吗？')) {
        records = [];
        renderRecords();
        showToast('记录已清空');
      }
    }

    // ========== 结束游戏 ==========
    function endGame() {
      document.getElementById('endOverlay').classList.add('show');
    }

    function closeEndConfirm(event) {
      if (!event || event.target.classList.contains('end-overlay')) {
        document.getElementById('endOverlay').classList.remove('show');
      }
    }

    // ========== 自动保存当前对局（每局记分后） ==========
    function saveCurrentSession() {
      const sessionData = {
        timestamp: Date.now(),
        round: state.round,
        lastScoreRound: state.lastScoreRound,
        isKaibao: state.isKaibao || false,
        initialScore: gameConfig.initialScore || 0,
        players: players.map(p => ({
          name: p.name,
          avatar: p.avatar,
          score: p.score,
          position: p.position,
        })),
        records: records.map(r => ({
          icon: r.icon,
          desc: r.desc,
          time: r.time,
          scores: r.scores ? r.scores.map(s => ({ name: s.name, score: s.score, avatar: s.avatar })) : undefined,
        })),
        config: {
          base: gameConfig.base,
          multiplier: gameConfig.multiplier,
          ceilingNormal: gameConfig.ceilingNormal,
          ceilingKaibaoMultiplier: gameConfig.ceilingKaibaoMultiplier,
        },
      };
      localStorage.setItem('mahjongLiveSession', JSON.stringify(sessionData));
    }

    // ========== 检查是否有未完成的对局 ==========
    function checkSession() {
      const raw = localStorage.getItem('mahjongLiveSession');
      if (!raw) return;
      const session = JSON.parse(raw);
      if (!session || !session.players || !session.records) {
        localStorage.removeItem('mahjongLiveSession');
        return;
      }
      // 显示恢复提示
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = `
        <div style="background:#1c2333;border-radius:20px;padding:30px;max-width:340px;text-align:center;border:1px solid #30363D;margin:16px;">
          <div style="font-size:28px;margin-bottom:10px;">🔄</div>
          <div style="font-size:17px;font-weight:600;color:#fff;margin-bottom:6px;">发现未完成的对局</div>
          <div style="font-size:13px;color:#8B949E;margin-bottom:6px;">
            第${session.round}局 · ${session.players.map(p=>p.name).join(' ')}
          </div>
          <div style="font-size:12px;color:#8B949E;margin-bottom:20px;">
            保存于 ${new Date(session.timestamp).toLocaleString('zh-CN')}
          </div>
          <div style="display:flex;gap:10px;">
            <button id="resumeDiscard" style="flex:1;padding:12px;border-radius:12px;background:transparent;border:1px solid #30363D;color:#8B949E;font-size:14px;cursor:pointer;font-family:inherit;">放弃</button>
            <button id="resumeConfirm" style="flex:1;padding:12px;border-radius:12px;background:linear-gradient(135deg,#FF6B35,#FF8F66);border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">恢复对局</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('resumeConfirm').onclick = () => {
        overlay.remove();
        restoreSession(session);
      };
      document.getElementById('resumeDiscard').onclick = () => {
        overlay.remove();
        localStorage.removeItem('mahjongLiveSession');
      };
    }

    function restoreSession(session) {
      // 恢复玩家数据
      session.players.forEach((sp, i) => {
        if (players[i]) {
          players[i].name = sp.name;
          players[i].avatar = sp.avatar;
          players[i].score = sp.score;
          players[i].position = sp.position;
        }
      });

      // 清空并恢复记录
      records.length = 0;
      session.records.forEach(r => records.push(r));

      // 恢复状态
      state.round = session.round;
      state.lastScoreRound = session.lastScoreRound;
      state.isKaibao = session.isKaibao;
      gameConfig.initialScore = session.initialScore;

      // 更新UI
      document.getElementById('roundText').textContent = `第${state.round}局`;
      renderPlayers();
      renderRecords();
      resetSelection();
      showToast('已恢复对局数据');
    }

    function confirmEndGame() {
      // 保存完整对局数据到 localStorage
      const gameData = {
        timestamp: new Date().toISOString(),
        initialScore: gameConfig.initialScore || 0,
        players: players.map(p => ({
          name: p.name,
          avatar: p.avatar,
          position: p.position,
          score: p.score,
        })),
        records: records.map(r => ({
          icon: r.icon,
          desc: r.desc,
          time: r.time,
          scores: r.scores ? r.scores.map(s => ({ name: s.name, score: s.score, avatar: s.avatar })) : undefined,
        })),
        config: {
          base: gameConfig.base,
          multiplier: gameConfig.multiplier,
          ceilingNormal: gameConfig.ceilingNormal,
          ceilingKaibaoMultiplier: gameConfig.ceilingKaibaoMultiplier,
        },
      };
      localStorage.setItem('mahjongGameData', JSON.stringify(gameData));
      localStorage.removeItem('mahjongLiveSession'); // 对局结束，清除自动保存
      window.location.href = 'mahjong-game-summary.html';
    }

    // ========== 显示提示 ==========
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ==========================================
    // 语音识别功能
    // ==========================================
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('voiceStatus').textContent = '⚠️ 当前浏览器不支持语音';
        document.getElementById('voiceBtn').disabled = true;
        document.getElementById('voiceBtn').style.opacity = '0.4';
        return;
      }
      _gotResult = false;

      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.interimResults = false;
      recognition.continuous = true;  // 持续收集，用户点结束才 stop
      recognition.maxAlternatives = 1;

      recognition.onresult = function(event) {
        const lastIdx = event.results.length - 1;
        const raw = event.results[lastIdx][0].transcript.trim();
        _gotResult = true;
        if (raw) {
          document.getElementById('voiceStatus').textContent = `✅ 识别到：「${raw}」`;
          parseVoiceInput(raw);
        } else {
          document.getElementById('voiceStatus').textContent = '⚠️ 未识别到有效语音';
        }
        recStop();
      };

      recognition.onerror = function(event) {
        const code = event.error || 'unknown';
        let msg = `❌ 语音出错（${code}）`;
        if (code === 'not-allowed') {
          msg = '⚠️ 请允许麦克风权限（浏览器地址栏左侧🔒→麦克风→允许），刷新重试';
        } else if (code === 'service-not-allowed') {
          msg = '⚠️ 浏览器语音服务被禁用，请用 Chrome 浏览器、检查网络，或在设置中开启语音输入';
        } else if (code === 'no-speech') msg = '未检测到语音，请点击录音后说话';
        else if (code === 'network') msg = '网络错误，请检查网络后重试';
        else if (code === 'aborted') return; // 用户手动停止，不显示错误
        document.getElementById('voiceStatus').textContent = msg;
        recStop();
      };

      recognition.onend = function() {
        if (!_gotResult) {
          document.getElementById('voiceStatus').textContent = '未检测到语音，请先点击录音再说话';
        }
        recStop();
      };
    }

    function recStop() {
      if (!isListening) return;
      isListening = false;
      document.getElementById('voiceBtn').classList.remove('recording');
      const btnText = document.getElementById('voiceBtnText');
      btnText.textContent = '🎤 点我录音';
    }

    function requestMicPermission(callback) {
      if (_micGranted) { callback(true); return; }
      // 如果还没授权，走异步 getusermedia
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        callback(true);
        return;
      }
      document.getElementById('voiceStatus').textContent = '📢 请求麦克风权限...';
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          stream.getTracks().forEach(track => track.stop());
          _micGranted = true;
          document.getElementById('voiceStatus').textContent = '✅ 麦克风已授权';
          callback(true);
        })
        .catch(function(err) {
          let msg = '❌ 麦克风被拒绝';
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            msg = '⚠️ 请允许麦克风权限（浏览器地址栏或设置中开启），然后刷新页面';
          } else if (err.name === 'NotFoundError') {
            msg = '⚠️ 未检测到麦克风设备';
          }
          document.getElementById('voiceStatus').textContent = msg;
          callback(false);
        });
    }

    function toggleVoice() {
      // 检查浏览器是否支持语音识别
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('voiceStatus').textContent = '⚠️ 当前浏览器不支持语音识别（请用 Android Chrome）';
        return;
      }
      if (isListening) {
        document.getElementById('voiceStatus').textContent = '⏳ 识别中...';
        try { recognition && recognition.stop(); } catch(e) {}
        recStop(); // 立即重置 UI
      } else {
        if (!_micGranted) {
          // 第一次：走异步 getUserMedia 请求权限
          requestMicPermission(function(granted) {
            if (!granted) return;
            startVoiceSync();
          });
        } else {
          // 已授权 → 同步启动（Android Chrome 要求用户点击事件内同步调用）
          startVoiceSync();
        }
      }
    }

    function startVoiceSync() {
      try { recognition && recognition.abort(); } catch(e) {}
      initSpeechRecognition();
      _gotResult = false;
      try {
        recognition.start();
        isListening = true;
        document.getElementById('voiceBtn').classList.add('recording');
        document.getElementById('voiceBtnText').textContent = '🔴 结束录音';
        document.getElementById('voiceStatus').textContent = '🎙️ 录音中...';
      } catch(e) {
        document.getElementById('voiceStatus').textContent = '❌ 启动失败，请重试';
      }
    }
            isListening = true;
            document.getElementById('voiceBtn').classList.add('recording');
            document.getElementById('voiceBtnText').textContent = '🔴 结束录音';
            document.getElementById('voiceStatus').textContent = '🎙️ 录音中... 完成后点「结束录音」';
          } catch(e) {
            document.getElementById('voiceStatus').textContent = '❌ 启动失败，请重试';
          }
        });
      }
    }

    // ========== 解析语音输入 ==========
    function parseVoiceInput(text) {
      // 先重置当前选择（保留局类型）
      state.selectedWinner = null;
      state.selectedPatterns = [];
      state.selectedDianpao = null;
      state.flowerCount = 0;

      const t = text.replace(/\s+/g, '').replace(/[，。！？、；：""''（）\.\,\!\?\;\:\"\'\(\)]/g, '');
      // 中文数字转阿拉伯数字（仅用于花数识别，不影响牌型关键词）
      const CN_NUM = {'零':'0','一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10'};
      let tNum = t;
      for (const [cn, num] of Object.entries(CN_NUM)) {
        tNum = tNum.replaceAll(cn, num);
      }

      // 1. 识别胡牌人（匹配玩家名称的任意子串）
      let winnerId = null;
      for (const p of players) {
        if (t.includes(p.name)) {
          winnerId = p.id;
          break;
        }
      }

      // 2. 识别花数
      let flowerCount = 0;
      const flowerMatch = tNum.match(/(\d+)个?花/);
      if (flowerMatch) flowerCount = parseInt(flowerMatch[1]);
      if (!flowerCount) { const m = tNum.match(/花(\d+)/); if (m) flowerCount = parseInt(m[1]); }
      // 说"没花""零花"也是0，保持默认即可

      // 3. 识别牌型关键词
      const matchedPatterns = [];

      // 自摸（关键词：自摸、自摸胡）
      if (t.includes('自摸') || t.includes('自胡')) {
        const pat = patterns.find(p => p.isZimo);
        if (pat) matchedPatterns.push(pat);
      }

      // 门清
      if (t.includes('门清') || t.includes('门')) {
        const pat = patterns.find(p => p.isMenqing);
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 碰碰胡
      if (t.includes('碰碰') || t.includes('对对胡') || t.includes('对对')) {
        const pat = patterns.find(p => p.name === '碰碰胡');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 清一色
      if (t.includes('清一色') || t.includes('清一')) {
        const pat = patterns.find(p => p.name === '清一色');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 混一色
      if (t.includes('混一色') || t.includes('混一')) {
        const pat = patterns.find(p => p.name === '混一色');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 平胡
      if (t.includes('平胡') || t.includes('平')) {
        const pat = patterns.find(p => p.name === '平胡');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 杠开
      if (t.includes('杠开') || t.includes('杠后开花')) {
        const pat = patterns.find(p => p.name === '杠开');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 七小对
      if (t.includes('七小对') || t.includes('七对') || t.includes('七小')) {
        const pat = patterns.find(p => p.name === '七小对');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 开宝
      if (t.includes('开宝') || t.includes('宝')) {
        const pat = patterns.find(p => p.name === '开宝');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 无花果
      if (t.includes('无花果')) {
        const pat = patterns.find(p => p.name === '无花果');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 天胡
      if (t.includes('天胡') || t.includes('天')) {
        const pat = patterns.find(p => p.name === '天胡');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 地胡
      if (t.includes('地胡') || t.includes('地')) {
        const pat = patterns.find(p => p.name === '地胡');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 花胡
      if (t.includes('花胡')) {
        const pat = patterns.find(p => p.name === '花胡');
        if (pat && !matchedPatterns.includes(pat)) matchedPatterns.push(pat);
      }

      // 4. 如果没有匹配到自摸，尝试识别点炮人
      const hasZimo = matchedPatterns.some(p => p.isZimo);
      let dianpaoId = null;
      if (!hasZimo) {
        // 点炮人关键词："点炮XXX" "XXX点炮" "XXX炮"
        for (const p of players) {
          if (p.id === winnerId) continue;
          if (t.includes(p.name)) {
            dianpaoId = p.id;
            break;
          }
        }
      }

      // ========== 应用识别结果 ==========
      if (winnerId) {
        state.selectedWinner = winnerId;
      }

      state.selectedPatterns = matchedPatterns;
      state.flowerCount = flowerCount;

      // 更新 UI
      document.getElementById('flowerValue').textContent = state.flowerCount;
      document.getElementById('infoFlower').textContent = state.flowerCount;

      if (winnerId) {
        document.getElementById('winnerHint').textContent = `✅ 语音识别：${players.find(p => p.id === winnerId).name}`;
      }

      if (dianpaoId && !hasZimo) {
        state.selectedDianpao = dianpaoId;
      }

      // 如果识别到"开宝"，自动切换到开宝局
      if (matchedPatterns.some(p => p.name === '开宝')) {
        setGameType('kaibao');
      }

      renderPlayers();
      renderWinnerButtons();
      renderPatternButtons();
      updateDianpaoSection();
      updateFlowerLock();
      updateSelectedInfo();
      updateScorePreview();
      updateConfirmBtn();

      // 反馈
      let feedback = '✅ ';
      if (winnerId) feedback += `${players.find(p => p.id === winnerId).name}胡 `;
      if (matchedPatterns.length > 0) feedback += matchedPatterns.map(p => p.name).join('+') + ' ';
      else feedback += '未匹配到牌型 ';
      if (flowerCount > 0) feedback += `${flowerCount}花 `;
      if (dianpaoId && !hasZimo) feedback += `点炮：${players.find(p => p.id === dianpaoId).name}`;
      feedback += `📝「${text}」`;
      document.getElementById('voiceStatus').textContent = feedback;

      // 强制重新渲染（移动端有时异步滞后）
      setTimeout(() => {
        renderPatternButtons();
        updateSelectedInfo();
        updateScorePreview();
        updateConfirmBtn();
      }, 0);
    }

    // 页面加载
    document.addEventListener('DOMContentLoaded', function() {
      init();
      checkSession();
    });
  </script>
